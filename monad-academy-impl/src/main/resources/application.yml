spring:
  application:
    name: monad-academy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/monad_academy
    username: monad_academy
    password: monad_academy
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS monad_academy
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: monad_academy
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    default-schema: monad_academy
    liquibase-schema: monad_academy
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

app:
  frontend-base-url: http://localhost:3000
  email-verification-token-ttl: 24h
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-before-production-change-this-secret}
    expiration: 1h
  java-runner:
    docker-image: eclipse-temurin:25-jdk-alpine
    compile-timeout: 10s
    run-timeout: 3s
    cleanup-timeout: 2s
    memory-limit: 128m
    memory-swap-limit: 128m
    java-heap-limit: 64m
    cpus: "0.5"
    pids-limit: 64
    tmpfs-size: 64m
    container-user: "65534:65534"
