services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=monad_academy'
      - 'POSTGRES_PASSWORD=monad_academy'
      - 'POSTGRES_USER=monad_academy'
    ports:
      - '5432:5432'
  mailpit:
    image: 'axllent/mailpit:v1.27'
    ports:
      - '1025:1025'
      - '8025:8025'
